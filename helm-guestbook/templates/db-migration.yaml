apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata: {}
    spec:
      containers:
      - command:
        - 'sh'
        - '-c'
        - "echo 'Running db migration...'; sleep 10; echo 'Done!'"
        image: busybox
        name: migration
        resources: {}
      restartPolicy: Never
status: {}
